name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Test without containers
        run: mvn -T 1C verify -DskipITs --batch-mode --no-transfer-progress

      - name: Upload coverage to Codecov
        if: matrix.java == '17'
        uses: codecov/codecov-action@v4
        with:
          files: bookkeeping-coverage/target/site/jacoco-aggregate/jacoco.xml,bookkeeping-core/target/site/jacoco/jacoco.xml,bookkeeping-jdbc/target/site/jacoco/jacoco.xml,bookkeeping-spring-boot-starter/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run MySQL and PostgreSQL integration tests
        run: mvn -T 1C -pl bookkeeping-jdbc -am verify --batch-mode --no-transfer-progress
